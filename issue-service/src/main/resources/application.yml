server:
  port: 8083

spring:
  application:
    name: issue-service

  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/issue_db?createDatabaseIfNotExist=true&serverTimezone=UTC
    username: ${DB_USER:its}
    password: "${DB_PASSWORD:Its#Tracker2026!}"
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    show-sql: false

  cloud:
    openfeign:
      client:
        config:
          default:
            connect-timeout: 2000
            read-timeout: 5000
            logger-level: basic
          comment-service:
            # The cascade fans out one call per issue, so a project with many issues
            # needs more headroom than a single lookup.
            read-timeout: 10000

its:
  seed:
    enabled: ${SEED_ENABLED:true}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

springdoc:
  # Published under this service's own gateway route, so one route reaches both the API
  # and its documentation. Left at the default /v3/api-docs the gateway would have to
  # carry a second route per service purely for docs.
  api-docs:
    path: /api/issues/v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.its.issue: INFO
    com.its.issue.client: DEBUG
