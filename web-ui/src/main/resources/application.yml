server:
  port: 8090
  # Bind on every interface so the system is reachable from other machines on the
  # network. This is Spring Boot's default when server.address is unset, but stating it
  # makes the intent explicit and gives one place to lock it down: set SERVER_ADDRESS to
  # 127.0.0.1 to make this service loopback-only again.
  address: ${SERVER_ADDRESS:0.0.0.0}
  servlet:
    session:
      timeout: 30m
      cookie:
        # The session cookie is the only credential the browser holds - the JWT itself
        # stays server-side (SRS A-14). HttpOnly keeps script from reading it; set
        # `secure: true` once this is served over TLS.
        http-only: true
        same-site: lax

spring:
  application:
    name: web-ui

  mvc:
    view:
      # Views live under WEB-INF so they cannot be requested directly. A JSP reached by
      # URL would skip the controller that authorises it and populates its model.
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  web:
    resources:
      static-locations: classpath:/static/

its:
  gateway:
    # Every call this tier makes goes here. It never names a service or a port.
    base-url: ${GATEWAY_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.its.web: INFO
