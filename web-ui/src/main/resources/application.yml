server:
  port: 8090
  servlet:
    session:
      timeout: 30m
      cookie:
        # The session cookie is the only credential the browser holds - the JWT itself
        # stays server-side (SRS A-14). HttpOnly keeps script from reading it; set
        # `secure: true` once this is served over TLS.
        http-only: true
        same-site: lax

spring:
  application:
    name: web-ui

  mvc:
    view:
      # Views live under WEB-INF so they cannot be requested directly. A JSP reached by
      # URL would skip the controller that authorises it and populates its model.
      prefix: /WEB-INF/jsp/
      suffix: .jsp

  web:
    resources:
      static-locations: classpath:/static/

its:
  gateway:
    # Every call this tier makes goes here. It never names a service or a port.
    base-url: ${GATEWAY_URL:http://localhost:8080}

management:
  endpoints:
    web:
      exposure:
        include: health

logging:
  level:
    com.its.web: INFO
