server:
  port: 8761
  # Bind on every interface so the system is reachable from other machines on the
  # network. This is Spring Boot's default when server.address is unset, but stating it
  # makes the intent explicit and gives one place to lock it down: set SERVER_ADDRESS to
  # 127.0.0.1 to make this service loopback-only again.
  address: ${SERVER_ADDRESS:0.0.0.0}

spring:
  application:
    name: eureka-server

eureka:
  client:
    # The registry does not register with itself, nor fetch a peer registry:
    # both default to true and would produce start-up connection errors.
    register-with-eureka: false
    fetch-registry: false
  server:
    # Self-preservation stops Eureka evicting instances when heartbeats dip, which is
    # right in production but confusing locally: a service you killed lingers as UP.
    enable-self-preservation: false
    eviction-interval-timer-in-ms: 15000

management:
  endpoints:
    web:
      exposure:
        include: health,info

logging:
  level:
    com.netflix.eureka: WARN
    com.netflix.discovery: WARN
